<title>탐험대 유형 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one ticket-shaped column for students; wider two-pane desk for the teacher tab. Four ride-type colors carry all meaning. */
:root {
  --bg: #eef2f8;
  --surface: #ffffff;
  --ink: #14213d;
  --muted: #5a6a86;
  --line: #d3dcea;
  --brand: #2446d6;
  --brand-ink: #ffffff;
  --t-a: #d93a21;
  --t-b: #2a62e8;
  --t-c: #0c8f7d;
  --t-d: #b87c00;
  --font-display: "Jua", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1526; --surface: #17213a; --ink: #eaf0ff; --muted: #9db0d1; --line: #2b3a5c;
    --brand: #7f9bff; --brand-ink: #0e1526;
    --t-a: #ff7a63; --t-b: #7ea3ff; --t-c: #3fd1bb; --t-d: #f2bd3d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1526; --surface: #17213a; --ink: #eaf0ff; --muted: #9db0d1; --line: #2b3a5c;
  --brand: #7f9bff; --brand-ink: #0e1526;
  --t-a: #ff7a63; --t-b: #7ea3ff; --t-c: #3fd1bb; --t-d: #f2bd3d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 16px; line-height: 1.6; padding-inline: 16px; padding-block: 20px 48px;
  word-break: keep-all; overflow-wrap: anywhere;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.25; margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.wrap { max-width: 640px; margin-inline: auto; }
.wrap.wide { max-width: 1040px; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.brandmark { font-family: var(--font-display); font-size: 20px; display: flex; align-items: center; gap: 8px; }
.brandmark i { width: 14px; height: 14px; border-radius: 50%; background: var(--t-a); box-shadow: 18px 0 0 var(--t-b), 36px 0 0 var(--t-c), 54px 0 0 var(--t-d); margin-right: 58px; display: inline-block; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-size: 14px; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* ticket */
.ticket { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; position: relative; padding: 24px 22px; }
.ticket.stub-top { padding-top: 22px; }
.perf { height: 0; border-top: 2px dashed var(--line); margin: 20px -22px; position: relative; }
.perf::before, .perf::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.perf::before { left: -11px; clip-path: inset(0 0 0 50%); }
.perf::after { right: -11px; clip-path: inset(0 50% 0 0); }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 700; }
.h-title { font-size: clamp(28px, 7vw, 38px); margin-top: 6px; }
.lead { color: var(--muted); margin-top: 10px; }

.field { display: grid; gap: 6px; margin-top: 16px; }
.field label, .field .lab { font-size: 14px; font-weight: 700; }
.input { width: 100%; min-height: 48px; padding: 10px 14px; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; }
.input:focus { border-color: var(--brand); outline: none; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { display: grid; place-items: center; min-height: 48px; border: 2px solid var(--line); border-radius: 12px; background: var(--bg); font-weight: 700; cursor: pointer; }
.seg input:checked + label { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 14%, var(--surface)); }
.seg input:focus-visible + label { outline: 3px solid var(--brand); outline-offset: 2px; }
.seg > div { position: relative; }

.btn { min-height: 48px; padding: 10px 20px; border-radius: 12px; border: 2px solid var(--ink); background: var(--ink); color: var(--bg); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.sm { min-height: 38px; padding: 6px 14px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.block { width: 100%; margin-top: 22px; }
.err { color: var(--t-a); font-size: 14px; margin-top: 10px; min-height: 1.4em; }

/* punches */
.punches { display: flex; gap: 6px; margin-bottom: 18px; }
.punches span { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.punches span.on { background: var(--brand); }
.qno { font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .08em; }
.q { font-size: clamp(22px, 5.5vw, 28px); margin-top: 6px; }
.opts { display: grid; gap: 10px; margin-top: 20px; }
.opt { text-align: left; display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start; padding: 14px; background: var(--bg); border: 2px solid var(--line); border-radius: 14px; min-height: 56px; }
.opt:hover { border-color: var(--brand); }
.opt b { width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); display: grid; place-items: center; font-size: 14px; }
.opt[aria-pressed="true"] { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 14%, var(--surface)); }
.opt[aria-pressed="true"] b { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.navrow { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }

/* result */
.result { --c: var(--t-a); }
.result[data-type="B"] { --c: var(--t-b); } .result[data-type="C"] { --c: var(--t-c); } .result[data-type="D"] { --c: var(--t-d); }
.badge { width: 72px; height: 72px; border-radius: 22px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, var(--surface)); color: var(--c); border: 2px solid var(--c); }
.badge svg { width: 38px; height: 38px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.r-name { font-size: 15px; color: var(--muted); margin-top: 16px; }
.r-type { font-size: clamp(32px, 9vw, 44px); color: var(--c); margin-top: 2px; }
.r-line { font-weight: 700; margin-top: 4px; }
.r-body { margin-top: 12px; color: var(--ink); }
.r-role { margin-top: 16px; padding: 14px; border-radius: 12px; background: color-mix(in srgb, var(--c) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line)); }
.r-role h3 { font-size: 16px; color: var(--c); }
.code { font-family: var(--font-mono); font-size: 20px; font-weight: 700; letter-spacing: .04em; padding: 12px 14px; border: 2px dashed var(--line); border-radius: 12px; text-align: center; margin-top: 10px; user-select: all; }
.status { font-size: 14px; color: var(--muted); margin-top: 10px; }

/* teacher */
.desk { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 820px) { .desk { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.panel h2 { font-size: 20px; }
.hint { font-size: 13px; color: var(--muted); }
textarea.input { min-height: 96px; resize: vertical; line-height: 1.5; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row .input { flex: 1 1 120px; min-width: 0; }
.tally { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.tally div { border-radius: 10px; padding: 8px 6px; text-align: center; font-size: 13px; background: color-mix(in srgb, var(--c) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 35%, var(--line)); }
.tally b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 24px; color: var(--c); line-height: 1.2; }
[data-t="A"] { --c: var(--t-a); } [data-t="B"] { --c: var(--t-b); } [data-t="C"] { --c: var(--t-c); } [data-t="D"] { --c: var(--t-d); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; max-height: 340px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface); font-size: 12px; letter-spacing: .06em; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 6px; }
.x { border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px 8px; border-radius: 8px; }
.x:hover { color: var(--t-a); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.out-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.gsec h3 { font-size: 18px; margin-bottom: 10px; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.g { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--bg); display: grid; gap: 8px; align-content: start; min-width: 0; }
.g h4 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 16px; color: var(--muted); }
.chip { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; background: color-mix(in srgb, var(--c) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line)); font-weight: 500; min-width: 0; }
.chip small { margin-left: auto; font-size: 12px; color: var(--c); white-space: nowrap; font-weight: 700; }
.note { padding: 10px 12px; border-radius: 10px; font-size: 14px; background: color-mix(in srgb, var(--t-d) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--t-d) 45%, var(--line)); }
.note.ok { background: color-mix(in srgb, var(--t-c) 14%, var(--surface)); border-color: color-mix(in srgb, var(--t-c) 45%, var(--line)); }
@media (prefers-reduced-motion: no-preference) {
  .opt { transition: border-color .12s, background-color .12s; }
}
</style>

<div class="wrap" id="shell">
  <div class="bar">
    <div class="brandmark"><i></i><span>탐험대</span></div>
    <div class="tabs" role="group" aria-label="화면 선택">
      <button type="button" id="tabStudent" aria-pressed="true">학생</button>
      <button type="button" id="tabTeacher" aria-pressed="false">교사용</button>
    </div>
  </div>
  <main id="studentView"></main>
  <main id="teacherView" hidden>
    <div class="desk">
      <div style="display:grid;gap:20px;min-width:0">
        <section class="panel" aria-labelledby="h-roster">
          <h2 id="h-roster">학생 결과</h2>
          <div class="tally" id="tally"></div>
          <div id="rosterBox"></div>
          <p class="hint" id="syncHint"></p>
        </section>
        <section class="panel" aria-labelledby="h-add">
          <h2 id="h-add">결과 직접 넣기</h2>
          <div class="row">
            <input class="input" id="addName" placeholder="이름" autocomplete="off" aria-label="이름">
            <select class="input" id="addGender" aria-label="성별" style="flex:0 0 84px"><option value="남">남</option><option value="여">여</option></select>
            <select class="input" id="addType" aria-label="유형" style="flex:0 0 120px">
              <option value="A">A 스릴 대장</option><option value="B">B 계획 박사</option><option value="C">C 느긋 감성러</option><option value="D">D 분위기 메이커</option>
            </select>
            <button class="btn sm" type="button" id="addOne">추가</button>
          </div>
          <div class="field" style="margin-top:0">
            <label for="pasteBox">여러 명 한꺼번에 붙여넣기</label>
            <textarea class="input" id="pasteBox" placeholder="한 줄에 한 명&#10;김하늘 여 B&#10;이도윤 남 A"></textarea>
            <button class="btn sm ghost" type="button" id="addMany" style="justify-self:start">붙여넣은 학생 추가</button>
          </div>
          <p class="hint">학생 화면에 나오는 코드(이름 성별 알파벳)를 그대로 붙여넣으면 됩니다.</p>
        </section>
      </div>
      <div style="display:grid;gap:20px;min-width:0">
        <section class="panel" aria-labelledby="h-opt">
          <h2 id="h-opt">모둠 편성</h2>
          <div class="row">
            <label for="sizeSel" style="font-weight:700;font-size:14px">모둠 크기</label>
            <select class="input" id="sizeSel" style="flex:0 0 150px">
              <option value="4">3~4명 (기본)</option><option value="3">2~3명</option>
            </select>
          </div>
          <div class="field" style="margin-top:0">
            <label for="friendBox">같은 모둠이 되면 안 되는 친한 친구 (선택)</label>
            <textarea class="input" id="friendBox" placeholder="한 줄에 한 묶음&#10;김하늘 박서연&#10;이도윤, 최민준, 정우진"></textarea>
            <p class="hint">한 줄에 적은 이름끼리는 서로 다른 모둠으로 나뉩니다. 이름은 결과 표와 똑같이 적어 주세요.</p>
          </div>
          <div class="row">
            <button class="btn primary" type="button" id="makeBtn">모둠 짜기</button>
            <span class="hint" id="makeHint"></span>
          </div>
        </section>
        <section class="panel" id="outPanel" hidden aria-live="polite">
          <div class="out-head">
            <h2>편성 결과</h2>
            <div class="row">
              <button class="btn sm ghost" type="button" id="reshuffle">다시 섞기</button>
              <button class="btn sm" type="button" id="copyBtn">텍스트로 복사</button>
            </div>
          </div>
          <div id="notes" style="display:grid;gap:8px"></div>
          <div id="groupsOut" style="display:grid;gap:20px"></div>
        </section>
      </div>
    </div>
  </main>
</div>

<script>
(function () {
  "use strict";

  var TYPES = {
    A: { key: "A", name: "스릴 대장", line: "무섭고 빠를수록 좋아! 도전 정신 만렙",
      body: "놀이공원에서 제일 먼저 달려가는 쪽은 언제나 나예요. 줄이 길어도 짜릿한 기구라면 기다릴 수 있는 용감한 탐험가입니다.",
      role: "모둠에서는 첫 발을 내딛는 도전 담당이에요. 다만 친구들의 속도도 한 번씩 살펴 주세요.",
      icon: '<path d="M13 2 4 14h6l-1 8 9-12h-6z"/>' },
    B: { key: "B", name: "계획 박사", line: "지도와 시간표가 내 무기인 알뜰 탐험가",
      body: "입구에서 지도부터 펼치고 오늘 코스를 짜는 사람이에요. 대기 시간과 동선을 보면 마음이 편해집니다.",
      role: "모둠에서는 길 찾기와 시간 관리 담당이에요. 계획이 바뀌어도 웃어넘기면 더 멋져요.",
      icon: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5z"/>' },
    C: { key: "C", name: "느긋 감성러", line: "분위기와 간식과 사진이 최고인 여유로운 산책가",
      body: "신나는 기구도 좋지만 예쁜 풍경, 맛있는 간식, 오늘의 기분이 더 소중해요. 기다리는 시간도 구경 시간으로 바꿔요.",
      role: "모둠에서는 속도 조절과 쉬어 가기 담당이에요. 하고 싶은 말은 꼭 소리 내어 말해 주세요.",
      icon: '<path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 9a4.5 4.5 0 0 1 .5 9z"/>' },
    D: { key: "D", name: "분위기 메이커", line: "같이 있으면 더 신나는 모둠의 접착제",
      body: "누구와도 금방 이야기를 시작하고 웃음을 만드는 사람이에요. 함께하는 시간이 놀이기구보다 더 중요해요.",
      role: "모둠에서는 분위기 담당이에요. 의견이 갈릴 때 서로의 말을 이어 주는 다리가 되어 주세요.",
      icon: '<circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/>' }
  };

  var QS = [
    { q: "놀이공원 입구에 도착했다! 제일 먼저 하는 일은?", o: {
      A: "제일 무서워 보이는 놀이기구 쪽으로 일단 달려간다", B: "안내 지도를 펴서 오늘 코스를 짠다",
      C: "예쁜 풍경과 캐릭터 가게를 둘러본다", D: "친구들과 \"우리 뭐부터 탈까?\" 의논한다" } },
    { q: "인기 놀이기구 대기 시간이 90분이래! 내 생각은?", o: {
      A: "무서운 거면 3시간도 기다릴 수 있다", B: "지금 말고 사람 적은 시간에 다시 오자",
      C: "간식 먹고 구경하다 보면 금방 간다", D: "친구랑 수다 떨고 게임하면 시간이 순식간에 간다" } },
    { q: "줄 서는 동안 나는 주로 뭘 하고 있을까?", o: {
      A: "앞에서 나는 소리에 귀 기울이며 두근두근한다", B: "남은 시간을 계산하고 다음 계획을 생각한다",
      C: "주변을 구경하거나 멍을 때린다", D: "앞뒤 사람들과도 말을 걸고 논다" } },
    { q: "롤러코스터가 맨 꼭대기에 올라갔다. 이때 나는?", o: {
      A: "\"와아아!\" 소리 지르며 두 손을 번쩍 든다", B: "안전바가 잘 잠겼는지 한 번 더 확인한다",
      C: "눈을 지그시 감고 바람을 느낀다", D: "옆 사람 손을 잡고 같이 소리 지른다" } },
    { q: "점심시간이다. 어떻게 먹고 싶어?", o: {
      A: "빨리 먹고 하나라도 더 타러 가자! 핫도그를 들고 걸으며 먹는다", B: "미리 알아 둔 식당에서 정해진 시간에 먹는다",

  /* grouping */
  function parseFriends(text) {
    var set = {};

      for (var i = 0; i < ns.length; i++) for (var j = i + 1; j < ns.length; j++) set[[ns[i], ns[j]].sort().join("|")] = 1;

      var seq = []; byType.forEach(function (a) { seq = seq.concat(a); });

  function subscribe() {
    if (T.subscribed) return; T.subscribed = true;
    useDb().then(function (db) {
      if (!db) { $("syncHint").textContent = "학생 제출 기능을 쓰려면 이 페이지를 계정으로 열어야 해요. 지금은 결과를 직접 넣어서 사용할 수 있어요."; return; }
      $("syncHint").textContent = "학생이 제출하면 이 목록에 바로 나타납니다.";
      db.collection("results").onSnapshot(function (snap) {
        T.remote = snap.docs.map(function (d) { return d.data(); }).filter(function (r) { return r && r.name && r.gender && r.type; });
        renderRoster();
      }, function () {});
    });
  }

  /* ---------- wiring ---------- */
  function show(view) {
    var teacher = view === "teacher";
    $("studentView").hidden = teacher; $("teacherView").hidden = !teacher;
    $("shell").classList.toggle("wide", teacher);
    $("tabStudent").setAttribute("aria-pressed", String(!teacher));
    $("tabTeacher").setAttribute("aria-pressed", String(teacher));
    try { history.replaceState(null, "", teacher ? "#teacher" : "#"); } catch (e) {}
    if (teacher) { renderRoster(); subscribe(); }
  }
  $("tabStudent").onclick = function () { show("student"); };
  $("tabTeacher").onclick = function () { show("teacher"); };

  $("addOne").onclick = function () {
    var n = $("addName").value.trim().replace(/\s+/g, ""); if (!n) { $("addName").focus(); return; }
    upsertManual([{ name: n, gender: $("addGender").value, type: $("addType").value }]);
    $("addName").value = ""; $("addName").focus();
  };
  $("addName").addEventListener("keydown", function (e) { if (e.key === "Enter") $("addOne").click(); });
  $("addMany").onclick = function () {
    var res = parseLines($("pasteBox").value);
    if (res.rows.length) upsertManual(res.rows);
    $("pasteBox").value = "";
    $("pasteBox").placeholder = res.rows.length + "명 추가" + (res.bad ? " · 읽지 못한 줄 " + res.bad + "개" : "");
  };
  $("friendBox").value = T.friends;
  $("makeBtn").onclick = build;
  $("reshuffle").onclick = build;
  $("copyBtn").onclick = copyText;

  newOrder(); renderStudent();
  if (location.hash === "#teacher") show("teacher");
})();
</script>
